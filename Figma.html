<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>급식 보기</title>
  </head>

  <body>
    <header class="top-bar">
      <button id="reloadBtn">급식 보기</button>
    </header>
    <main class="content">
      <div class="time-block">
        <p class="date-label" id="date-display">2026 - 04 - 08</p>
        <p class="clock" id="clock-display">00 : 00 : 00</p>
      </div>

      <div class="meal-section">
        <p class="school-name" id="school-heading">4월 8일 광주소마고의</p>
        <p id="status"></p>

        <div class="meal-grid">
          <div class="meal-col">
            <h3 class="meal-title">오늘의 아침은?</h3>
            <div class="meal-card">
              <div class="meal-list" id="breakfast"></div>
            </div>
          </div>

          <div class="meal-col">
            <h3 class="meal-title">오늘의 점심은?</h3>
            <div class="meal-card">
              <div class="meal-list" id="lunch"></div>
            </div>
          </div>

          <div class="meal-col">
            <h3 class="meal-title">오늘의 저녁은?</h3>
            <div class="meal-card">
              <div class="meal-list" id="dinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
